# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: "3"

dotenv: [".env"]

vars:
  FACEFIND_DATABASE_DSN: '{{.FACEFIND_DATABASE_DSN | default ""}}'

tasks:

  help:
    desc: print this help message
    cmds:
      - task --list-all
    silent: true

  run:
    desc: run the cmd/facefind application
    cmds:
      - go run ./cmd/facefind

  tidy:
    desc: format all .go files, and tidy and vendor module dependencies
    cmds:
      - echo 'Formatting .go files'
      - go fmt ./...
      - echo 'Tidying module dependencies'
      - go mod tidy
      - echo 'Verifying dependencies...'
      - go mod verify

  migrations:new:
    desc: create a new database migration
    vars:
      NAME: '{{.name | default ""}}'
    cmds:
      - |
        if [ -z "{{.NAME}}" ]; then
          echo "Error: name parameter is required"
          echo "Usage: task migrations:new name=migration_name"
          exit 1
        fi
      - echo 'Creating migration file for {{.NAME}}...'
      - tern new -m ./internal/database/migrations {{.NAME}}

  migrations:up:
    desc: apply all up database migrations
    prompt: "Are you sure?"
    cmds:
      - echo 'Running up migrations...'
      - tern migrate -m ./internal/database/migrations --conn-string "{{.FACEFIND_DATABASE_DSN}}"